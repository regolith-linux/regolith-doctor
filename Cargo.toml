[workspace]
resolver = "3"
members = ["crates/doctor-core", "crates/doctor-checks", "crates/regolith-doctor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/regolith-linux/regolith-doctor"

[workspace.dependencies]
doctor-core = { path = "crates/doctor-core" }
doctor-checks = { path = "crates/doctor-checks" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
